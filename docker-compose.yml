services:
  checkpoint-pihole:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    # Pass all .env vars so PIHOLE_{PREFIX}_* credentials reach the container
    env_file:
      - .env
    environment:
      # Empty when unset so settings.py auto-generates and persists a random key
      # in the ./data volume (a public placeholder would defeat that).
      - SECRET_KEY=${SECRET_KEY:-}
      - TIME_ZONE=${TIME_ZONE:-UTC}
      - TZ=${TIME_ZONE:-UTC}
      - REQUIRE_AUTH=${REQUIRE_AUTH:-false}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - DEBUG=${DEBUG:-false}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
